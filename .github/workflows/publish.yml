name: Publish to PyPI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize version allocation and upload without dropping pending main pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.14"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pyright
      - run: uv build
      - run: uv run pytest -m "not native"

  build:
    needs: verify
    if: >-
      github.repository == 'ELDment/wps-mcp' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feat/')) &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --group dev

      - name: Prepare dated release
        run: uv run --no-sync python scripts/ci/prepare_release.py

      - name: Build distributions with locked build dependencies
        run: uv build --no-sources --no-build-isolation
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error
          overwrite: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/wps-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist/
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A failed upload can be retried using the same built distributions.
          skip-existing: true
